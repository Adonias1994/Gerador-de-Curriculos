<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Currículos</title>
    <link rel="stylesheet" href="/static/css.css">
</head>
<body>
    <main>
        <h1>Gerador de Currículos</h1>
        <p>Preencha os dados abaixo para gerar o seu currículo de forma automática.</p>

        <form id="formulario-curriculo" action="/gerar-curriculo" method="POST">
            
            <!-- 1. DADOS PESSOAIS -->
            <fieldset>
                <legend>Dados Pessoais</legend>
                
                <label for="nome">Nome Completo: *</label>
                <input type="text" id="nome" name="nome" required>

                <label for="email">E-mail: *</label>
                <input type="email" id="email" name="email" required>

                <label for="telefone">Telefone:</label>
                <input type="tel" id="telefone" name="telefone" placeholder="(XX) X XXXX-XXXX" pattern="\(\d{2}\) \d \d{4}-\d{4}">

                <div class="grupo-endereco">
                    <label for="cep">CEP:</label>
                    <input type="text" id="cep" name="cep">

                    <label for="rua">Rua:</label>
                    <input type="text" id="rua" name="rua">

                    <label for="numero">Número:</label>
                    <input type="text" id="numero" name="numero">

                    <label for="complemento">Complemento:</label>
                    <input type="text" id="complemento" name="complemento">

                    <label for="bairro">Bairro:</label>
                    <input type="text" id="bairro" name="bairro">

                    <label for="cidade">Cidade:</label>
                    <input type="text" id="cidade" name="cidade">

                    <label for="estado">Estado:</label>
                    <input type="text" id="estado" name="estado">
                </div>
            </fieldset>

            <!-- 2. EXPERIÊNCIA PROFISSIONAL -->
            <fieldset id="secao-experiencias">
                <legend>Experiência Profissional</legend>
                
                <!-- Contêiner que será clonado pelo JavaScript -->
                <div class="bloco-experiencia">
                    <label>Nome da Empresa:
                        <input type="text" name="empresa[]">
                    </label>

                    <label>Cargo Ocupado:
                        <input type="text" name="cargo[]">
                    </label>

                    <label>Data de Início:
                        <input type="date" name="data_inicio_exp[]">
                    </label>

                    <label>Data de Fim:
                        <input type="date" name="data_fim_exp[]">
                    </label>

                    <div class="checkbox-alinhado">
                        <label>
                            <input type="checkbox" name="trabalho_atual[]" value="sim">
                            Trabalho atualmente neste cargo
                        </label>
                    </div>

                    <label>Descrição das Atividades:
                        <textarea name="descricao_cargo[]" rows="4" placeholder="Descreva as suas principais responsabilidades e conquistas..."></textarea>
                    </label>
                    <hr>
                </div>

                <!-- Botão de ação (Não submete o formulário) -->
                <button type="button" id="btn-add-experiencia" class="btn-adicionar">+ Adicionar outra experiência</button>
            </fieldset>

            <!-- 3. FORMAÇÃO ACADÊMICA E CERTIFICAÇÕES -->
            <fieldset id="secao-formacoes">
                <legend>Formação e Qualificações</legend>
                
                <div class="bloco-formacao">
                    <label>Formação Acadêmica:
                        <input type="text" name="formacao[]" placeholder="Ex: Ciência da Computação - Universidade X">
                    </label>

                    <label>Cursos Complementares e Certificações:
                        <textarea name="cursos[]" rows="3" placeholder="Liste os seus cursos, como Python, Security+, etc."></textarea>
                    </label>
                    <hr>
                </div>

                <button type="button" id="btn-add-formacao" class="btn-adicionar">+ Adicionar outra formação</button>
            </fieldset>

            <!-- 4. INFORMAÇÕES COMPLEMENTARES -->
            <fieldset>
                <legend>Links Profissionais</legend>
                
                <label for="linkedin">LinkedIn:</label>
                <input type="url" id="linkedin" name="linkedin" placeholder="https://linkedin.com/in/o-seu-perfil">

                <label for="portfolio">Portfólio / GitHub:</label>
                <input type="url" id="portfolio" name="portfolio" placeholder="https://github.com/o-seu-utilizador">
            </fieldset>

            <button type="submit" class="btn-submit">Gerar Currículo</button>
        </form>
    </main>

    <script src="/static/javascript.js"></script>
</body>
</html>
